# ferrite 公开壳仓 CI：源码在私有主仓（地址只在下方 PRIVATE_REPO env 出现），由主仓 ci-dispatch 触发。
# lint 与 test 并行；test 关卡启动 PostgreSQL，数据库测试真实执行。
# PR（pr 入参非空）走 testless 快关，main push / 手动 full=true 走全量。
# 回写主仓的 commit status 按关卡分流两个 context：快关 `shell-ci`（= 合并门，主仓
# .agent/rules/testing-ci.md 只认它），全量 `shell-ci-full`（合并后异步、不阻塞、不进合并门）。
# 描述里的 "(full)" 标记保留供人眼辨认；真正的区分靠 context 名，不靠描述文字。
# 缓存与用法详见 .github/README.md。

name: ci

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '待测私有仓 commit SHA'
        required: true
      status_sha:
        description: '回写 shell-ci 状态的私有仓 commit SHA（空 = 用 sha；PR 派发传 PR 头提交，让 gh pr checks 看得到）'
        required: false
        default: ''
      pr:
        description: 'PR 编号（空 = main push / 手动触发）'
        required: false
        default: ''
      base:
        description: 'PR base 分支名'
        required: false
        default: 'main'
      full:
        description: 'true = 强制全量测试'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  # main push 按 sha 分键：所有 main run 挤在 'main' 单组会被 cancel-in-progress 互相取消（制造 cancelled 假红）；PR 组 pr-N 语义不变，新 push 作废旧 run 是省分钟的刻意设计。
  group: ci-${{ inputs.pr != '' && format('pr-{0}', inputs.pr) || format('main-{0}', inputs.sha) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: hathawayANdRX105/ferrite

jobs:
  # 格式化与静态检查，不依赖数据库。
  lint-check:
    runs-on: ubuntu-latest
    # 壳仓缓存冷启（清缓存后首个 run）全量编译需要余量。
    timeout-minutes: 45
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      # 改动面判定（docs-only 快通道）：本次 diff 没碰编译面时跳过本 job 的重活，
      # 只留便宜守卫。判定器在私有仓 scripts/ci-scope.sh（与 wasm-check.sh 同源），
      # 拿不到 diff 一律回落 full——判定错的代价是慢，漏判的代价是 CI 假绿。
      - name: 判定改动面（docs-only 快通道）
        id: scope
        run: |
          set -euo pipefail
          # 只有 PR 快关可能走 docs-only。全量（main push / 手动 full=true）是合并后的
          # 安全网，也是 cargo/sccache 缓存的唯一写入方——跳过它等于把 main 的兜底验证
          # 和缓存回填一起放弃，故一律按 full。
          #
          # 另出一个 `xtask` 开关：xtask 是**独立 workspace**，`just test`（根 workspace 的
          # cargo test --all）不覆盖它，于是 xtask/check/tests/ 下的 probe 在 CI 里从没跑过
          # （实测全量 run 39155097666 日志里 xtask 零命中，我新加的 pages_own_ui_probe 与
          # 既有的 dep_edge_bin_layer 都被漏掉）。只有本轮 diff 真碰 `xtask/` 才单跑它的测试：
          # 无脑跑会让每个非 docs-only 的 PR 白付一次 check-* 的编译（分钟级，且大多数 PR 用不上）。
          if [ -z "${{ inputs.pr }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo ">>> 全量 run（main push / full=true）：不走快通道"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "xtask=true" >> "$GITHUB_OUTPUT"   # 全量是安全网，xtask 也跑
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"
          base="origin/${{ inputs.base }}"
          if git diff --name-only "$base"...HEAD 2>/dev/null | grep -q '^xtask/'; then
            echo "xtask=true" >> "$GITHUB_OUTPUT"
          else
            echo "xtask=false" >> "$GITHUB_OUTPUT"
          fi
          # 判定器还没进私有仓 main（它与本 workflow 分仓落地，存在时间差）：
          # 缺失不是代码问题，按 full 跑，别把三关打红。
          if [ ! -f scripts/ci-scope.sh ]; then
            echo ">>> scripts/ci-scope.sh 尚未就位（私有仓未合入），按 full 处理"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "xtask=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode="$(bash scripts/ci-scope.sh "$base")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo ">>> 改动面判定: $mode（base=$base）"

      # 步骤级改动面标志：让同一个 job 里的重活按 diff 跳过，而不是整 job 跳。
      # 产出方是私有仓的 scripts/ci-scope-flags.sh（与 ci-scope.sh 同源，但那个给 job
      # 级的 docs-only 快通道，这个给步骤级开关）。
      #
      # 两处分仓落地的时间差按「缺席即保守」处理：脚本不在树上就全给 true / 空 pkgs，
      # 于是 clippy 全跑、doc 守卫全跑 —— 与加这个步骤之前的行为完全一致，不会因为
      # 壳仓先合而把门禁改松。
      - name: 读取步骤级标志（rules / rust / pkgs）
        id: flags
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.pr }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo ">>> 全量 run：步骤级标志一律保守"
            out=""
          elif [ ! -f scripts/ci-scope-flags.sh ]; then
            echo ">>> scripts/ci-scope-flags.sh 尚未就位（私有仓未合入）→ 保守：全跑"
            out=""
          else
            base="origin/${{ inputs.base }}"
            out="$(bash scripts/ci-scope-flags.sh "$base" || true)"
          fi
          rules="$(printf '%s\n' "$out" | sed -n 's/^rules=//p')"; rules="${rules:-true}"
          rust="$(printf '%s\n' "$out" | sed -n 's/^rust=//p')";   rust="${rust:-true}"
          pkgs="$(printf '%s\n' "$out" | sed -n 's/^pkgs=//p')"
          echo ">>> rules=$rules rust=$rust pkgs='${pkgs:-（空→全仓）}'"
          {
            echo "rules=$rules"
            echo "rust=$rust"
            echo "pkgs=$pkgs"
          } >> "$GITHUB_OUTPUT"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # ui-components 契约测试要真实链接，mold 不可省；apt 加固同 test 关卡。
      - name: 装 mold
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang shellcheck

      - name: 装 sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（lint 角色，restore-only）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-lint-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-lint-${{ runner.os }}-v0.10.0-
            sccache-test-${{ runner.os }}-v0.10.0-

      - name: 装 Bun（web 样式构建链）
        if: steps.scope.outputs.mode != 'docs-only'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 样式类守卫（check-style-classes.mjs）+ 双入口 CSS 构建在 CI 硬拦：
      # 未登记页面类 / kit 配方漂移在这里红，不等浏览器冒烟。
      # Bin-layer compat: web entry points move from apps/ to bin/ in mono W5;
      # resolve either generation so both trees pass this step.
      - name: web 样式守卫 + CSS 构建
        if: steps.scope.outputs.mode != 'docs-only'
        run: |
          set -euo pipefail
          web_dir=$([ -d bin/web ] && echo bin/web || echo apps/web)
          kit_dir=$([ -d bin/kit-demo ] && echo bin/kit-demo || echo apps/kit-demo)
          (cd "$web_dir" && bun install --frozen-lockfile && bun run css)
          (cd "$kit_dir" && bun install --frozen-lockfile && bun run css)

      # ui-components 契约测试显式全跑：testless 的函数级影响分析看不见纯数据
      # const（TOKEN_GROUPS）与 asset CSS 的 diff，快关会漏选 theme/style 契约。
      # 包名自适应：主仓 main 与在途分支可能分别处于 ui-kit / ui-components 两个
      # 世代（改名随前端分层重构迁移），硬编码任一名字都会把另一侧的 PR 快关
      # 卡死在 "package did not match any packages"。问 cargo metadata 要真身。
      # 两个世代都不在树上（前端分层重构未合入的过渡树）时必须显式跳过：
      # grep 无命中在 set -euo pipefail 下同样会把整步带红，exit 0 才是真跳过。
      # mono main 合入 #249 后本 step 自动恢复执行。
      - name: ui-kit/ui-components 契约测试
        if: steps.scope.outputs.mode != 'docs-only'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          PKG=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].name] | map(select(. == "ui-kit" or . == "ui-components")) | first // empty')
          if [ -z "$PKG" ]; then
            echo ">>> 树上没有 ui-kit / ui-components（前端分层重构尚未合入 main）；"
            echo ">>> kit 契约测试按包缺席跳过，#249 合入后本 step 自动恢复执行。"
            exit 0
          fi
          echo "kit contract gate: package = $PKG"
          cargo test -p "$PKG" --tests

      # wasm32 编译门禁：AGENTS.md 要求 crates/web 下必须支持 wasm32-unknown-unknown，
      # 而本仓 CI 此前没有任何一步在编 wasm（唯一真编点是部署镜像）——规则等于无人把守。
      # 判定与编译都在主仓的 scripts/wasm-check.sh 里：默认走文件级路径判定，因为本 job
      # 不装 testless（装它要多花一次 cargo install，而那是 test job 的事）；显式设
      # WASM_CHECK_DECIDER=files 而不是靠「testless 恰好没装」这种隐式契约。
      # 命中 crates/ui/**、bin/web/**、bin/kit-demo/**、crates/harness/agent-prompts/
      # 下的 .rs/.toml 才真编；无关改动秒级跳过；根 Cargo.toml/Cargo.lock 变动与拿不到
      # diff 一律保守跑（与 test-fast 的降级纪律同源）。
      - name: 取 base 分支（wasm 门禁判定用）
        run: git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"

      - name: 装 wasm32 目标
        if: steps.scope.outputs.mode != 'docs-only'
        run: rustup target add wasm32-unknown-unknown

      - name: wasm32 编译门禁
        if: steps.scope.outputs.mode != 'docs-only'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr }}" ]; then
            base="origin/${{ inputs.base }}"
            echo ">>> PR 派发：判定 base = ${base}（merge-base 比较）"
          else
            base="HEAD~1"
            echo ">>> main push / 手动派发：判定 base = HEAD~1"
          fi
          # stacked 分支可能没有这个脚本（改动面不含 wasm 域）——缺文件按「无 wasm 变更」跳过，
          # 不让 lint-check 整体 exit 127（spec-problem 05）。
          if [ -f scripts/wasm-check.sh ]; then
            WASM_CHECK_DECIDER=files bash scripts/wasm-check.sh "$base"
          else
            echo "scripts/wasm-check.sh not present on this branch; skipping wasm gate"
          fi

      # 迁移布局守卫（无 PG 可跑）：版本前缀重复 / 正文混入 git log 行。
      # testless 看不见 db/migrations 纯数据目录的 diff，#41 撞号（两个 0023）
      # 从快关漏过、把 main 弄红，这里无条件跑死。
      # 包名自适应：主仓 main 与在途分支可能分别处于 db / app-db 两个世代
      # （单例 crate 加 app- 前缀的改名波次，同 ui-kit step 的时序耦合病），
      # 硬编码任一名字都会把另一侧的 PR 快关卡死在 "package did not match
      # any packages"。问 cargo metadata 要真身；两个世代都不在树上（改名中间态）
      # 时显式跳过并说明，不静默绿也不无谓带红。
      - name: db/app-db 迁移布局守卫（世代自适应）
        if: steps.scope.outputs.mode != 'docs-only'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PKG=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].name] | map(select(. == "app-db" or . == "db")) | first // empty')
          if [ -z "$PKG" ]; then
            echo ">>> 树上没有 app-db / db（改名波次的中间态）；迁移布局守卫按包缺席跳过。"
            exit 0
          fi
          echo "migration layout gate: package = $PKG"
          cargo test -p "$PKG" --test migrations_layout

      # 形态回归网：apps/api 的形态面。形态别名（ferrite-*）存在时逐个 check
      # --no-default-features --features <别名>——default（三形态世代 = ferrite-server）
      # 已被上面的 clippy --all-targets 覆盖，但这些非默认配置没有任何测试会编译，
      # 别名被改坏（如误把 tavern 塞进 ferrite-local）只有这里能红——cargo 的
      # feature 统一（#10266）也让它们绝不能进共享 crate。别名收敛成单形态
      # （tavern 删除后）时改查另外两种配置：default 与 --no-default-features。
      # 判定问 cargo metadata 要真身（同 ui-kit step 的世代自适应风格）。
      - name: 形态检查（随 apps/api 的别名世代自适应）
        if: steps.scope.outputs.mode != 'docs-only'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ALIASES=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '[.packages[] | select(.name == "api") | .features | keys[] | select(startswith("ferrite-"))] | sort | .[]')
          if [ -z "$ALIASES" ]; then
            echo ">>> 无形态别名（单形态世代）：check default 与 --no-default-features"
            cargo check -p api
            cargo check -p api --no-default-features
          else
            echo ">>> 形态别名：$(echo "$ALIASES" | tr '\n' ' ')"
            while read -r feature; do
              echo ">>> cargo check -p api --no-default-features --features ${feature}"
              cargo check -p api --no-default-features --features "$feature"
            done <<< "$ALIASES"
          fi

      - name: cargo fmt
        run: cargo fmt --all --check

      # clippy 的收窄面是「改动包 ∪ 它们的 workspace 反向依赖」，由私有仓的
      # scripts/ci-scope-flags.sh 算出。闭包是必需品不是优化：
      #   `cargo clippy -p A` 只 lint A 及其**依赖**，不 lint A 的**下游**。
      #   改了共享 crate 让下游触发新的 lint 错误时，只查改动包会漏，红会流到 main。
      #   闭包对叶子包很小（真省），对被广泛依赖的包会自然长到接近全仓（此时本来就该全查）。
      # pkgs 为空（脚本缺席 / 推不出）一律回落全仓，保守。
      - name: cargo clippy（改动包 ∪ 反向依赖）
        if: steps.scope.outputs.mode != 'docs-only' && steps.flags.outputs.rust == 'true'
        run: |
          set -euo pipefail
          pkgs="${{ steps.flags.outputs.pkgs }}"
          if [ -z "${pkgs// }" ]; then
            echo ">>> pkgs 为空（脚本缺席或推不出）→ 全仓 clippy（保守）"
            cargo clippy --all-targets -- -D warnings
          else
            args=()
            for p in $pkgs; do args+=(-p "$p"); done
            echo ">>> clippy 收窄到 ${#args[@]} 个包（改动包 ∪ 反向依赖）"
            cargo clippy --all-targets "${args[@]}" -- -D warnings
          fi

      # xtask 是独立 workspace（自己的 Cargo.toml / Cargo.lock / target），而全量配方
      # `just test` = `cargo test --all` 只覆盖根 workspace —— xtask/check/tests/ 下的
      # probe 因此在 CI 里从未执行（实证：全量 run 39155097666 日志里 xtask 零命中，
      # pages_own_ui_probe 与既有的 dep_edge_bin_layer 两条 probe 都被漏掉）。
      # 这里按上面的 `xtask` 开关补跑：改动碰了 xtask/ 才付 check-* 的编译。
      # 首次编译含 canon 的 check-* git 依赖，故给 20 分钟（之后吃缓存）。
      - name: xtask 规则 crate 测试（按 diff 门控）
        if: steps.scope.outputs.xtask == 'true'
        timeout-minutes: 20
        run: cargo test --manifest-path xtask/Cargo.toml

      # canon 的 bash 规则 CD-06（主仓 .githooks/spec/code/code_bash.yaml，shellcheck --format=gcc）
      # 在工具缺失的机器上按设计降级为 WARN 跳过，于是 bash 脚本可能长期没人检查
      # （真实漏网：主仓 benches/scripts/bench_gateway.sh 少一个闭合引号，`bash -n` 都过不去）。
      # 这里在 CI 里按同一口径补跑；主仓等价入口是 `just lint-shell`。
      # 跳过符号链接——shellcheck 会顺链把同一个文件报两遍（benches/scripts/deploy_bench_key.sh 是软链）。
      # 位置放在 cargo fmt / clippy 之后：步骤一红，同 job 后面的步骤全被 skipped，
      # 放前面会让一条 shell 发现掩掉所有 Rust 信号（实测 run 38155447476 就是这样）。
      - name: shell 闸门（shellcheck，与 canon CD-06 同口径）
        run: |
          set -euo pipefail
          # bin/ is a Rust tree in the W5 generation; keep shell files only.
          mapfile -t files < <(git ls-files '*.sh' 'bin/*.sh' 'lib/*.sh')
          real=()
          for f in "${files[@]}"; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then real+=("$f"); fi
          done
          # --severity=style：canon CD-06 不传 severity（默认 style = 四级全开），这里写死防以后默认变化；
          # 与主仓 `just lint-shell` 同参数。注意本机退回 `bun x shellcheck` 时不出 note 级，两边不完全等价。
          shellcheck --severity=style --format=gcc "${real[@]}"

      # 规范文档工具名守卫（无 PG、无 wasm 可跑）：`.agent/rules/*.md` 与 harness-agent-prompts 的
      # prompts 片段里，cg_/sem_ 前缀的工具名必须都已注册。
      #
      # 门控理由的演进：早先它**无条件跑死**，依据是「testless 的 seed 只来自 Rust 文件，
      # 纯 .md 改名会让快关零用例空跑、绿着把漂移合进 main」。那条对 testless 成立，
      # 但路径检查直接看得见 .md —— 改由 ci-scope-flags.sh 的 `rules` 开关门控，
      # 只在本轮 diff 真碰 `.agent/rules/**` 或 `crates/harness-agent-prompts/**` 时跑。
      # 安全边界与先前一致：`rules` 的保守值是 true（脚本缺席 / 拿不到 base 一律跑），
      # 且它的触发面正是这条守卫唯一会红的两处。
      #
      # 位置与上面的 shell 闸门同理放在 fmt/clippy 之后：步骤一红，后面的步骤全被 skipped。
      # 它是本 job 首次 codegen + 链接 harness-agent-prompts 的 dev-dep tools（ast-grep + tree-sitter
      # C 语法 + host 侧 db/turso），构建量级高于 db 守卫，故给 15 分钟（同 ui-kit 契约测试）。
      # 实测代价：run 39212811029 里这一步 102s，而多数 PR 的 diff 碰不到它的触发面。
      - name: 规范文档工具名守卫
        if: steps.flags.outputs.rules == 'true'
        timeout-minutes: 15
        run: cargo test -p harness-agent-prompts --test tool_selection_tests

      # 写入方 run（main push / full=true）结束后回填；键已存在则自动 no-op。
      # always()：失败 run 的编译产物同样有复用价值。
      - name: 回填 cargo 缓存（仅写入方）
        if: always() && (inputs.pr == '' || inputs.full == 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: 回填 sccache 缓存（仅写入方，日键）
        if: always() && (inputs.pr == '' || inputs.full == 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-lint-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}

  # 端上壳编译守卫：apps|platforms/{desktop,mobile} 各自独立 workspace（shell_root 探测双布局），根 Cargo.toml 的 members
  # 不含它们，clippy --all-targets / just test 都编不到——而两个壳都在**编译期**调
  # tauri::generate_context!()（读 tauri.conf.json：bundle.icon 缺 RGBA PNG 直接 panic，
  # 上游 tauri-v2.12.4 context.rs:215-224/479-493 + image.rs:79-85）。实测缺口见 #342：
  # 桌面壳 bundle.icon 留空 + icons/ 只有 README，本机 cargo check 一编即 panic，
  # 而 CI 无任何一步编它（apps|platforms/* 不在主 workspace 的依赖图里）。
  # 本 job 只做 cargo check，不装 Android 工具链：移动壳的 Android 出包由 release.yml
  # 的 android job 承担（dry-run 可验），这里补的是「改配置/图标就红」的编译级回归网。
  # mold + clang + sccache 不可省：apps|platforms/*/src-tauri 向上搜索会命中仓根 .cargo/config.toml
  # （linker=clang、ld-path=mold、rustc-wrapper=sccache），缺任一个都编译不过（spike 实测定论）。
  app-shell-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      # 改动面判定（docs-only 快通道）：本次 diff 没碰编译面时跳过本 job 的重活，
      # 只留便宜守卫。判定器在私有仓 scripts/ci-scope.sh（与 wasm-check.sh 同源），
      # 拿不到 diff 一律回落 full——判定错的代价是慢，漏判的代价是 CI 假绿。
      - name: 判定改动面（docs-only 快通道）
        id: scope
        run: |
          set -euo pipefail
          # 只有 PR 快关可能走 docs-only。全量（main push / 手动 full=true）是合并后的
          # 安全网，也是 cargo/sccache 缓存的唯一写入方——跳过它等于把 main 的兜底验证
          # 和缓存回填一起放弃，故一律按 full。
          if [ -z "${{ inputs.pr }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo ">>> 全量 run（main push / full=true）：不走快通道"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"
          base="origin/${{ inputs.base }}"
          # 判定器还没进私有仓 main（它与本 workflow 分仓落地，存在时间差）：
          # 缺失不是代码问题，按 full 跑，别把三关打红。
          if [ ! -f scripts/ci-scope.sh ]; then
            echo ">>> scripts/ci-scope.sh 尚未就位（私有仓未合入），按 full 处理"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode="$(bash scripts/ci-scope.sh "$base")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo ">>> 改动面判定: $mode（base=$base）"
      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # tauri v2 在 Linux 的构建前置（tauri 官方 prerequisite）：webkit2gtk-sys 的
      # build.rs 用 pkg-config 找它们，cargo check 阶段就要，不能拖到真打包。
      - name: 装 tauri Linux 依赖
        if: steps.scope.outputs.mode != 'docs-only'
        run: |
          set -euo pipefail
          timeout 300 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # 仓根 .cargo/config.toml 的 linker=clang + ld-path=mold（jobs=6 本机现算）。
      - name: 装 mold + clang
        if: steps.scope.outputs.mode != 'docs-only'
        run: |
          set -euo pipefail
          timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      # rustc-wrapper=sccache：不装则每个 rustc 调用以 "sccache not found" 失败。
      - name: 装 sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（app-shell 角色，restore-only）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-appshell-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-appshell-${{ runner.os }}-v0.10.0-
            sccache-lint-${{ runner.os }}-v0.10.0-
            sccache-test-${{ runner.os }}-v0.10.0-

      - name: 取 base 分支（壳编译判定用）
        if: inputs.pr != ''
        run: git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"

      - name: 端上壳 cargo check（diff 门禁）
        if: steps.scope.outputs.mode != 'docs-only'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr }}" ]; then
            base="origin/${{ inputs.base }}"
            git rev-parse --verify -q "$base" >/dev/null || base=""   # 拿不到 base 时保守全量
          else
            base="HEAD~1"
          fi
          if [ -n "$base" ]; then
            echo ">>> 判定 merge-base 范围: ${base}...HEAD（仅 apps|platforms/**）"
            files="$(git diff --name-only "${base}"...HEAD -- apps platforms || true)"
          else
            echo ">>> 拿不到 base（分支被删 / force-push），保守全量跑"
            files="apps platforms"
          fi
          if [ -z "$files" ]; then
            echo "::notice::apps|platforms 无变更，端上壳编译跳过"
            exit 0
          fi
          printf '%s\n' "$files" | sed 's/^/  壳变更: /'
          shell_root=$([ -d platforms ] && echo platforms || echo apps)
          for shell in desktop mobile; do
            dir="${shell_root}/${shell}/src-tauri"
            if [ ! -d "$dir" ]; then
              echo ">>> ${dir} 不存在（壳布局变动），跳过 ${shell}"
              continue
            fi
            echo ">>> cargo check ${shell}（${dir}）"
            (cd "$dir" && cargo check)
          done
          echo ">>> 端上壳编译守卫通过"

  # 测试连接临时 PostgreSQL；db_bootstrap 在测试启动时应用迁移。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        # 钉版本（与 deploy/compose.yml 同口径）：TimescaleDB 正把压缩 API
        # 迁到 columnstore 命名，漂移会改迁移 0026 里策略守卫的匹配面。
        image: timescale/timescaledb:2.28.3-pg18
        env:
          POSTGRES_USER: ferrite
          POSTGRES_PASSWORD: ferrite
          POSTGRES_DB: ferrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrite -d ferrite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ferrite:ferrite@localhost:5432/ferrite
      FERRITE_E2E_DATABASE_URL: postgres://ferrite:ferrite@localhost:5432/ferrite
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      # 改动面判定（docs-only 快通道）：本次 diff 没碰编译面时跳过本 job 的重活，
      # 只留便宜守卫。判定器在私有仓 scripts/ci-scope.sh（与 wasm-check.sh 同源），
      # 拿不到 diff 一律回落 full——判定错的代价是慢，漏判的代价是 CI 假绿。
      - name: 判定改动面（docs-only 快通道）
        id: scope
        run: |
          set -euo pipefail
          # 只有 PR 快关可能走 docs-only。全量（main push / 手动 full=true）是合并后的
          # 安全网，也是 cargo/sccache 缓存的唯一写入方——跳过它等于把 main 的兜底验证
          # 和缓存回填一起放弃，故一律按 full。
          if [ -z "${{ inputs.pr }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo ">>> 全量 run（main push / full=true）：不走快通道"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"
          base="origin/${{ inputs.base }}"
          # 判定器还没进私有仓 main（它与本 workflow 分仓落地，存在时间差）：
          # 缺失不是代码问题，按 full 跑，别把三关打红。
          if [ ! -f scripts/ci-scope.sh ]; then
            echo ">>> scripts/ci-scope.sh 尚未就位（私有仓未合入），按 full 处理"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode="$(bash scripts/ci-scope.sh "$base")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo ">>> 改动面判定: $mode（base=$base）"
      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 装 just（justfile 配方入口）
        if: steps.scope.outputs.mode != 'docs-only'
        # just.systems CDN 曾 403 挂掉整个 test job；改走 GitHub release +
        # runner 自带 token（免匿名 API 限流）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/casey/just/releases/latest --jq .tag_name)
          gh release download "$tag" -R casey/just \
            -p "just-*x86_64-unknown-linux-musl.tar.gz" -O - | tar xzf - just
          sudo install -m755 just /usr/local/bin/just
          just --version

      - name: 装 mold
        if: steps.scope.outputs.mode != 'docs-only'
        # apt 镜像曾整段挂死到 job 超时；显式重试 + 硬超时，让故障快速失败可重跑。
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      - name: 装 sccache
        if: steps.scope.outputs.mode != 'docs-only'
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（test 角色，restore-only）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-test-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-test-${{ runner.os }}-v0.10.0-
            sccache-lint-${{ runner.os }}-v0.10.0-

      - name: 装 testless（test-fast 的影响分析器，仅 PR 快关需要）
        if: inputs.pr != '' && inputs.full != 'true'
        run: cargo install testless --locked

      # PR 快关需要本地 origin/<base> ref（checkout sha 是 detached）。
      - name: 取 base 分支（testless 影响分析用）
        if: inputs.pr != '' && inputs.full != 'true'
        run: git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"

      # PR（pr 非空且非 full）→ test-fast（testless 影响分析；异常 / 零命中自动降级全量）。
      # main push / 手动 full=true → 全量 just test。
      - name: 测试
        if: steps.scope.outputs.mode != 'docs-only'
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr }}" ] && [ "${{ inputs.full }}" != "true" ]; then
            echo ">>> PR 快关：just test-fast（testless diff 影响分析）"
            just test-fast origin/${{ inputs.base }}
          else
            echo ">>> 全量关卡：just test"
            just test
          fi

      - name: 回填 cargo 缓存（仅写入方）
        if: always() && (inputs.pr == '' || inputs.full == 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: 回填 sccache 缓存（仅写入方，日键）
        if: always() && (inputs.pr == '' || inputs.full == 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-test-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}

  # 聚合两关卡结果，写 commit status `shell-ci` 回主仓：落点 = status_sha（空则回退 sha）。
  report:
    needs: [lint-check, test, app-shell-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 状态描述里点明「这次是不是走了 docs-only 快通道」——否则秒回的绿与跑满 10 分钟
      # 的绿在 PR 列表里长得一模一样，看的人无从判断这次到底验了什么。
      # 检出失败不阻断回写：回写状态比描述好看更重要，判定拿不到就按 full 描述。
      - name: 检出私有源码（判定 docs-only 用）
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      - name: 判定改动面（描述用）
        id: scope
        continue-on-error: true
        run: |
          set -euo pipefail
          # 只有 PR 快关可能走 docs-only。全量（main push / 手动 full=true）是合并后的
          # 安全网，也是 cargo/sccache 缓存的唯一写入方——跳过它等于把 main 的兜底验证
          # 和缓存回填一起放弃，故一律按 full。
          if [ -z "${{ inputs.pr }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo ">>> 全量 run（main push / full=true）：不走快通道"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${{ inputs.base }}:refs/remotes/origin/${{ inputs.base }}"
          base="origin/${{ inputs.base }}"
          echo "mode=$(bash scripts/ci-scope.sh "$base")" >> "$GITHUB_OUTPUT"

      - name: 回写 commit status
        env:
          GH_TOKEN: ${{ secrets.FERRITE_PAT }}
          # cancelled ≠ failure：被并发组取消不代表代码有问题，回写 pending 表示等待重派/手动补派，不能折成红（GH commit status 接受 pending）。
          # app-shell-check 无 job 级 if（跳过在 step 内做 notice exit 0），不会被 skipped；
          # cancelled 与另两关同口径折成 pending，让重派后能重新回写。
          STATE: "${{ (needs.lint-check.result == 'success' && needs.test.result == 'success' && needs.app-shell-check.result == 'success' && 'success') || ((needs.lint-check.result == 'cancelled' || needs.test.result == 'cancelled' || needs.app-shell-check.result == 'cancelled') && 'pending') || 'failure' }}"
          DESC: "${{ format('ferrite-ci{0}{1}: lint {2}, test {3}, app-shell {4}', inputs.full == 'true' && ' (full)' || '', steps.scope.outputs.mode == 'docs-only' && ' (docs-only)' || '', needs.lint-check.result, needs.test.result, needs.app-shell-check.result) }}"
          # 快关与全量写**不同的 context**：`shell-ci` 是合并门（主仓 .agent/rules/testing-ci.md
          # 只认这个名字），`shell-ci-full` 是合并后异步跑的全量。此前两者共用 `shell-ci`，
          # 同一个 head commit 上两条 run 抢同一个状态槽、谁后跑完谁覆盖谁，全量红会把合并门
          # 的绿顶掉（或反过来），`gh pr checks` 也分不清看到的是哪一关。
          CONTEXT: "${{ inputs.full == 'true' && 'shell-ci-full' || 'shell-ci' }}"
          URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          TARGET="${{ inputs.status_sha || inputs.sha }}"
          # SHA 已不存在（分支 force-push/删除，spec-problem 04 的竞态面）时
          # GitHub 返回 422——这不是代码问题，跳过回写而不是把 report 打红。
          if ! gh api "repos/${{ env.PRIVATE_REPO }}/commits/$TARGET" > /dev/null 2>&1; then
            echo "target sha $TARGET no longer exists; skipping status write"
            exit 0
          fi
          gh api "repos/${{ env.PRIVATE_REPO }}/statuses/$TARGET" \
            -f state="$STATE" -f context="$CONTEXT" -f description="$DESC" -f target_url="$URL" \
            > /dev/null
          echo "status $STATE posted to $TARGET as context=$CONTEXT"
