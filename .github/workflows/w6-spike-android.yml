# w6-spike-android：W6-spike 出包专用的一次性 workflow。
# 用途：以 PAT 检出私有仓 hathawayANdRX105/ferrite 的 spike 分支 sha，在公开壳仓构建
# Android debug APK（aarch64）——产物不入库、不上传 artifact，绿 run 日志里的
# 「W6-SPIKE-APK path=… size=… sha256=…」行即凭证（公开仓不存私有代码产物）。
# 触发仅 workflow_dispatch（保持壳仓「on: 只有 workflow_dispatch」不变量）；无 cache 步骤。
# 一次性 spike：正式移动发布链属 W6 主线，另做；完成后删除（删除动作经维护者确认后执行）。

name: w6-spike-android

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'hathawayANdRX105/ferrite spike 分支的 commit SHA'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出私有源码（PAT，写法同 ci.yml）
        uses: actions/checkout@v4
        with:
          repository: hathawayANdRX105/ferrite
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FERRITE_PAT }}

      - name: Java 17（temurin；Gradle 9.6.1 支持 17–26，AGP 9.x 最低 JDK 17）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust stable + aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 装 Bun（apps/mobile 的 tauri CLI 依赖）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装 mold + clang（仓根 .cargo/config.toml 的 host linker 约定）
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      - name: 装 sccache（仓根 .cargo/config.toml 的 rustc-wrapper；只装二进制，不接缓存）
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.10.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          sccache --version

      - name: Android env 核对 + 选定 NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root" && test -d "$sdk_root"
          echo "SDK root: $sdk_root"
          echo "== 预装 NDK =="
          ls "$sdk_root/ndk"
          # tauri-cli 的 NDK 常量是 29.0.13846066，但只在交互安装时用；这里优先选本机 29.x
          # （cargo-mobile2 只要求 NDK >= r19，不校验常量），没有 29.x 再退到最大版本。
          ndk="$(ls -d "$sdk_root"/ndk/29.* 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$ndk" ]; then
            ndk="$(ls -d "$sdk_root"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          test -n "$ndk"
          echo "选定 NDK: $ndk"
          cat "$ndk/source.properties" | sed -n '1,5p'
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
          } >> "$GITHUB_ENV"

      - name: 版本快照（java / rust / bun）
        run: |
          set -euo pipefail
          java -version
          rustc --version && cargo --version
          bun --version

      - name: bun install（apps/mobile）
        working-directory: apps/mobile
        run: bun install

      - name: tauri android init（--ci；aarch64 target 已预装故跳过 rustup 安装）
        working-directory: apps/mobile
        run: bun run tauri android init --ci --skip-targets-install

      - name: tauri android build（debug APK，aarch64）
        working-directory: apps/mobile
        run: bun run tauri android build --debug --apk --target aarch64

      - name: APK 证据（路径 / 大小 / sha256；不落 artifact）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            ls -l "$apk"
            sha256sum "$apk"
            echo "W6-SPIKE-APK path=$apk size=$(stat -c '%s' "$apk") sha256=$(sha256sum "$apk" | awk '{print $1}')"
          done
