# 服务器 runner 可用性自检（手动触发）：验证 self-hosted runner 能承担壳仓 CI 的实际负载。
# 用途：① 迁移期验收服务器（docker 服务容器 / sudo apt / gh / rust / 私有仓检出 / 网络）；
#       ② 日常 ops：服务器重启、docker 或 runner 升级后一键体检。
# 恒跑 [self-hosted, ferrite-ci]：runner 不在线时本 workflow 会一直排队——排队本身就是信号。
name: runner-check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPO: hathawayANdRX105/ferrite

jobs:
  check:
    runs-on: [self-hosted, ferrite-ci]
    timeout-minutes: 20
    services:
      postgres:
        # 与 ci.yml test 关卡同镜像：既验证 Docker 服务容器链路，也预热镜像层缓存。
        image: timescale/timescaledb:2.28.3-pg18
        env:
          POSTGRES_USER: ferrite
          POSTGRES_PASSWORD: ferrite
          POSTGRES_DB: ferrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrite -d ferrite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: runner 信息与资源
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          uname -srm
          echo "--- cpu / mem / disk ---"
          nproc
          free -h | sed -n '1,2p'
          df -h / "$RUNNER_WORKSPACE"
          echo "--- docker ---"
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'cgroup={{.CgroupVersion}} driver={{.Driver}}'

      - name: 检出私有源码（PAT 快检）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 1

      - name: sudo 与 apt
        run: |
          set -euo pipefail
          sudo -n true && echo "sudo: OK (NOPASSWD)"
          timeout 300 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang jq

      - name: 工具链
        run: |
          set -euo pipefail
          command -v gh jq mold clang git curl rustup cargo rustc
          rustup show active-toolchain
          gh --version | sed -n 1p
          cargo metadata --format-version 1 --no-deps | jq -r '"workspace packages: \(.packages | length)"'

      - name: PostgreSQL 服务容器可达
        run: |
          set -euo pipefail
          timeout 30 bash -c 'until echo > /dev/tcp/127.0.0.1/5432; do sleep 1; done'
          echo "postgres port 5432: OK"

      - name: token 对本仓 runners API 的能力（ci.yml decide 关卡用哪个 token 的事实依据）
        env:
          TOK_GITHUB: ${{ github.token }}
          TOK_FERRITE_PAT: ${{ secrets.FERRITE_PAT }}
        run: |
          set -uo pipefail
          for name in TOK_GITHUB TOK_FERRITE_PAT; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer ${!name}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners") || code=curl-failed
            echo "${name} -> HTTP ${code}: $(sed -n 1p /tmp/body)"
          done
