# ferrite 发布壳工作流：私有主仓（地址只在下方 PRIVATE_REPO env 出现）推 ferrite-v* tag（或手动派发），
# 由主仓 ferrite-release.yml 派发触发（on 只有 workflow_dispatch，同 ci.yml 不变量）。
# 检出凭据拉私有源码构建，产物两边同步发布（维护者 2026-10-09 决策：二进制 + config 模板 +
# 五组 notes 可公开）：私有主仓 + 本公开壳仓，同一 tag 同一份资产与 notes。
# 源码仍不进壳仓：只在一次性 runner 检出，提交进本仓的只有 workflow YAML，Actions artifact 恒为 0。
#   tag 非空 且 dry_run=false → 两侧 Release 同步（缺失则创建，已存在则 clobber 资产并对齐 notes）
#   tag 为空 或 dry_run=true  → 只编译打包验证，产物随 runner 销毁
#
# 形态 asset（方案 A：一条版本线，一个 tag 挂每个形态一份产物；形态别名定义在
# 私有仓 apps/api/Cargo.toml，本 workflow 只消费并随形态世代自适应）：
#   三形态世代（ferrite-{local,tavern,server} 别名存在时）：
#     ferrite-local   --no-default-features --features ferrite-local   （个人 relay，无 billing/mcp）
#     ferrite-tavern  --no-default-features --features ferrite-tavern  （用户酒馆，仅 tavern）
#     ferrite-server  --no-default-features --features ferrite-server  （服务器，tavern+billing+mcp）
#   单形态世代（别名收敛后）：只出 ferrite-server，default 特性构建（= 原 server
#   形态；tavern 删除后 default 即完整产品），docker tag 契约不变（server = :latest）。
# 各形态共用同一 tag、同一 release notes，notes 不按形态分裂。
# 移动壳（apps/mobile）恒随同一 tag 出一份 Android debug APK：
#   ferrite-mobile-<版本段>.apk（universal、未 strip，体积大属预期）。
#   用 debug 签名（免 keystore）——正式签名与产物分发口径由维护者另行裁决；
#   命令序列取自 W6 spike 的实测配方（todo/w6-spike/README.md §C/§F 同口径），
#   与形态二进制同一 job：不做 artifact 传递（保持「Actions artifact 恒为 0」），
#   构建失败即整条发布失败（原子性：要么全发要么不发）。
#
# 版本快照（2026-10-17 壳仓实测，spike run 39013969883 / 39014614301；三处浮点已锁）：
#   apps/desktop|mobile/package.json  @tauri-apps/cli = 2.12.3（exact，原 ^2.11.5）
#   apps/*/src-tauri/Cargo.toml      tauri / tauri-build = 2.12.4（exact，原 "2" caret）
#   tauri-cli 2.12.3 生成的 Android 模板栈（随 CLI 换代，升级须同步此快照）：
#     Gradle 9.6.1 / AGP 9.3.1 / Kotlin 2.2.10 / compileSdk 37 /
#     runner 预装 NDK 29.0.14206865（本 job 显式选版本） / JDK 17（AGP 9.x 最低）
#   注意：第一阶段 §2 记的 2.11.5 时代模板数据（Gradle 8.14.3 / AGP 8.11.0 /
#   Kotlin 1.9.25 / SDK 36）已过时——那份快照来自旧 CLI 模板常量，勿照抄。
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的私有仓 commit / 分支'
        required: true
      tag:
        description: '要发布的 tag（ferrite-v*，空 = 不发布）'
        required: false
        default: ''
      dry_run:
        description: 'true = 只编译打包，不创建 Release'
        required: false
        default: 'false'
      mobile:
        description: 'true = 附带构建 Android debug APK；false = 只发形态二进制'
        required: false
        default: 'true'

# contents: write 仅为发布到本壳仓自身（github.token 只覆盖本仓）；主仓仍走 FERRITE_PAT。
# token 不自动注入 env，仅下方发布步骤显式引用，构建步骤拿不到。
permissions:
  contents: write
  packages: write   # GHCR 推送（ferrite-api / ferrite-admin-web 镜像）

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: hathawayANdRX105/ferrite
  # GHCR 命名空间：镜像挂在维护者账号下，别人才能 ghcr.io/hathawayANdRX105/... 拉取。
  # deploy/compose.yml 的 image 字段必须与这里一致。
  PRIVATE_REPO_OWNER: hathawayANdRX105

jobs:
  release:
    runs-on: ubuntu-latest
    # LTO fat + codegen-units=1 冷启构建需要余量；三形态世代是三次独立 release
    # 构建（feature 图不同、无法复用产物），其中 local/tavern 两条 sccache 轨冷启，
    # 留 90；单形态世代只需一次构建，余量富余。
    timeout-minutes: 90
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 装 mold
        # apt 曾整段挂死；显式重试 + 硬超时，让故障快速失败可重跑（同 ci.yml）。
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      - name: 装 sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 ci run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（release 角色，restore-only 回退到 test/lint 日键）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-release-${{ runner.os }}-v0.10.0-
            sccache-test-${{ runner.os }}-v0.10.0-
            sccache-lint-${{ runner.os }}-v0.10.0-

      - name: 探测形态（随 apps/api 的别名世代自适应）
        id: shapes
        run: |
          set -euo pipefail
          # 形态清单落在 shapes.txt：每行 <形态名>|<cargo feature 参数>（可为空）。
          # 三形态世代（ferrite-local 别名存在）：三条各自 --no-default-features，
          # 每条都不能省——省掉它 default 仍生效，三条会全变成同一形态；单形态
          # 世代（tavern 删除后别名收敛）：只出 server 一条，default 特性即完整产品。
          # 判定问 cargo metadata 要真身（同 ci.yml 的世代自适应风格）。
          if cargo metadata --format-version 1 --no-deps \
            | jq -e '.packages[] | select(.name == "api") | .features | has("ferrite-local")' > /dev/null; then
            printf '%s\n' \
              'local|--no-default-features --features ferrite-local' \
              'tavern|--no-default-features --features ferrite-tavern' \
              'server|--no-default-features --features ferrite-server' > shapes.txt
          else
            printf '%s\n' 'server|' > shapes.txt
          fi
          echo '>>> 形态清单（<形态名>|<feature 参数>）：'
          cat shapes.txt

      - name: 编译形态二进制
        run: |
          set -euo pipefail
          # 各形态 feature 图不同 → 各自独立 cargo build，且 --target-dir 必须隔离
          # （共用 target 会让多次 build 覆盖同一个 target/release/ferrite）。
          build_one() {
            local name="$1"; shift
            echo ">>> cargo build ferrite-${name}: $*"
            cargo build --release -p api --target-dir "target/rel-${name}" "$@"
            cp "target/rel-${name}/release/ferrite" "out-bin/ferrite-${name}"
          }
          mkdir -p out-bin
          # $features 故意不加引号：可能含多个参数（--no-default-features --features X）；
          # 单形态世代为空串时展开为零个参数（走 default 构建）。
          while IFS='|' read -r name features; do
            [ -n "$name" ] || continue
            build_one "$name" $features
          done < shapes.txt
          ls -l out-bin

      - name: 打包
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ -n "$TAG" ]]; then
            # tag: ferrite-v<M.R.P>-g<hash>；各形态统一版本线（见 version-stats skill）
            SPEC="${TAG#ferrite-v}"               # M.R.P-g<hash>
            VER="${SPEC%%-g*}"                    # M.R.P
            DIST="ferrite-v${VER}-g${SPEC#*-g}"   # = TAG
          else
            VER="dev-$(git rev-parse --short HEAD)"
            DIST="ferrite-${VER}"
          fi
          # Release notes：只收用户可感知 commit，五组过滤（参照 oh-my-pi；口径 = version-stats skill）。
          # 在发版 commit 的父上找上一个 ferrite-v* tag，避免 describe 命中发版点自身导致区间为空
          if git rev-parse --quiet --verify 'HEAD^' >/dev/null; then
            LAST=$(git describe --match 'ferrite-v*' --tags --abbrev=0 'HEAD^' 2>/dev/null) || LAST=""
          else
            LAST=""
          fi
          if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; fi
          SUBJ=$(git log $RANGE --no-merges --format='%s')
          {
            echo "${DIST}"
            echo
            section() {
              local lines
              lines=$(grep -E "$2" <<< "$SUBJ" || true)
              if [ -n "$lines" ]; then
                echo "### $1"
                echo
                sed 's/^/- /' <<< "$lines"
                echo
              fi
            }
            section "Breaking Changes" '^[a-z]+(\([^)]*\))?!:'
            section "Added"            '^feat(\([^)]*\))?:'
            section "Changed"          '^refactor(\([^)]*\))?:'
            section "Fixed"            '^(fix|perf)(\([^)]*\))?:'
            section "Removed"          '^revert(\([^)]*\))?:'
          } > release-notes.md
          # 每形态一份 tarball：目录名 = 形态前缀 + 版本段，tar 内是该形态二进制 +
          # 安全配置示例（占位符/注释字段；compose 专用的 deploy/config/config.toml
          # 含 compose 服务名/口令，不打包）+ prompt 语料。
          # 语料必须是运行时资产：渠道探活（channel_test）从
          # config/prompt-templates.jsonl 读提问语料，二进制不内嵌它
          # （见 control_plane::prompt_templates::load_templates）。
          # 漏打它 → 裸机部署解压即用、但探活报「no prompt template available」。
          # config.toml.example 文案已说明默认读 ./config/prompt-templates.jsonl。
          mkdir -p dist
          while IFS='|' read -r form _; do
            [ -n "$form" ] || continue
            ADIST="ferrite-${form}-${DIST#ferrite-}"
            mkdir -p "dist/${ADIST}/config"
            cp "out-bin/ferrite-${form}" "dist/${ADIST}/"
            cp config/prompt-templates.jsonl "dist/${ADIST}/config/"
            cp deploy/config/config.toml.example "dist/${ADIST}/config/config.toml.example"
            tar -czf "dist/${ADIST}-linux-x86_64.tar.gz" -C dist "${ADIST}"
            rm -rf "dist/${ADIST}"
          done < shapes.txt
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "dist=${DIST}" >> "$GITHUB_OUTPUT"
          # 只输出哈希与体积（不 echo 源码/二进制内容）
          sha256sum dist/*.tar.gz
          du -h dist/*.tar.gz
        id: pkg

      # ---- Android debug APK（apps/mobile；命令序列 = W6 spike 实测配方）----
      - name: 装 Java 17（Android 构建链）
        if: inputs.mobile == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Bun（移动壳的 tauri-cli 入口）
        if: inputs.mobile == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Android 工具链（SDK / NDK 三变量 / aarch64 target）
        if: inputs.mobile == 'true'
        run: |
          set -euo pipefail
          # runner 预装 Android SDK；NDK 取版本号最大的一个（spike 实测路径形态）。
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "Android SDK 不在 $SDK"; exit 1; }
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          test -n "$NDK" || { echo "NDK 缺失（$SDK/ndk/*）"; exit 1; }
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          # 证据：选定 NDK 的版本串（spike 报告 §F 同口径）
          grep -E '^Pkg\.Revision' "$NDK/source.properties"

      - name: 构建 Android debug APK
        if: inputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          SPEC="${{ steps.pkg.outputs.dist }}"
          SPEC="${SPEC#ferrite-}"
          bun install
          bunx tauri android init --ci
          bunx tauri android build --debug --apk --target aarch64
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$APK" || { echo "APK 未产出：$APK"; exit 1; }
          cp "$APK" "../../dist/ferrite-mobile-${SPEC}.apk"
          # 证据行：路径 + 体积 + sha256（不 echo 产物内容）
          sha256sum "../../dist/ferrite-mobile-${SPEC}.apk"
          du -h "../../dist/ferrite-mobile-${SPEC}.apk"

      # ---- 容器镜像（GHCR）----
      # deploy/ 的两个 Dockerfile 早已按形态构建（deploy/api/Dockerfile 的
      # FEATURES build-arg、deploy/web/Dockerfile 的 dx build），此处只是把它们
      # 接到发布链上，让「别人 docker compose up 就能用」成立——此前
      # deploy/compose.yml 引的 ghcr.io/newxapi/* 是第三方组织的私有镜像，
      # 既非本项目产物也拉不到，等于 compose 的「快速跑」是坏的。
      #
      # tag 口径与 compose 期望一致：compose.yml 读 :latest（= server 全功能形态），
      # compose.personal.yml 读 :local；:tavern 按 deploy/README.md 的形态表补齐。
      # 每形态额外打一个版本 tag，便于回溯某个 release 用了哪个镜像。
      #
      # 登录用 FERRITE_PAT（与主仓 Release 同步同一个 PAT）：镜像要挂在维护者账号下
      # 才能让别人拉；用 github.token 会挂在壳仓名下，而壳仓是公开壳、不是产物归属。
      # 依赖 FERRITE_PAT 具 write:packages 权限——该范围无法在此仓内自证，
      # 首次推送后需确认 ghcr.io/hathayaANdRX105/ferrite-api 的 tags 列表。
      - name: 登录 GHCR
        if: inputs.tag != '' && inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.PRIVATE_REPO_OWNER }}
          password: ${{ secrets.FERRITE_PAT }}

      - name: 构建并推送容器镜像
        if: inputs.tag != '' && inputs.dry_run != 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SPEC="${TAG#ferrite-v}"
          # compose 的 tag 契约：server → :latest，其余用形态名；单形态世代清单
          # 只有 server → 只推 :latest，deploy/compose.yml 的 image 契约不变。
          tag_for() { case "$1" in server) echo latest ;; *) echo "$1" ;; esac; }
          # FEATURES 传形态的 cargo 参数（可为空 = default 构建，见 deploy/api/Dockerfile）。
          while IFS='|' read -r form features; do
            [ -n "$form" ] || continue
            docker build -f deploy/api/Dockerfile \
              --build-arg "FEATURES=${features}" \
              -t "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-api:$(tag_for "$form")" \
              -t "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-api:$(tag_for "$form")-${SPEC}" \
              .
            docker push "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-api:$(tag_for "$form")"
            docker push "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-api:$(tag_for "$form")-${SPEC}"
          done < shapes.txt
          # admin-web 三形态共用同一个 SPA（deploy/web/Dockerfile 无形态参数），
          # deploy/README.md「已知差异」已注明按形态裁剪待 issue #59。
          docker build -f deploy/web/Dockerfile \
            -t "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-admin-web:latest" \
            -t "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-admin-web:${SPEC}" .
          docker push "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-admin-web:latest"
          docker push "ghcr.io/${PRIVATE_REPO_OWNER}/ferrite-admin-web:${SPEC}"

      - name: 两边同步发布 GitHub Release（私有主仓 + 公开壳仓）
        if: inputs.tag != '' && inputs.dry_run != 'true'
        env:
          FERRITE_PAT: ${{ secrets.FERRITE_PAT }}
          SHELL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 资产名 = ferrite-<形态>-<版本段>-linux-x86_64.tar.gz（版本段 = tag 去 ferrite- 前缀）
          DIST="${{ steps.pkg.outputs.dist }}"
          SPEC="${DIST#ferrite-}"
          ASSETS=()
          while IFS='|' read -r form _; do
            [ -n "$form" ] || continue
            ASSETS+=("dist/ferrite-${form}-${SPEC}-linux-x86_64.tar.gz")
          done < shapes.txt
          if [[ "${{ inputs.mobile }}" == "true" ]]; then
            test -f "dist/ferrite-mobile-${SPEC}.apk" || { echo "缺少移动资产 dist/ferrite-mobile-${SPEC}.apk"; exit 1; }
            ASSETS+=("dist/ferrite-mobile-${SPEC}.apk")
          fi
          # 同一口径同步两侧：缺失则创建（资产 + 标题 + notes），已存在则 clobber 资产并对齐 notes。
          # 主仓用 FERRITE_PAT（跨仓），壳仓用本 workflow 的 github.token（仅本仓写权）。
          sync_release() {
            local target="$1" token="$2"
            if GH_TOKEN="$token" gh release view "${{ inputs.tag }}" -R "$target" >/dev/null 2>&1; then
              GH_TOKEN="$token" gh release upload "${{ inputs.tag }}" "${ASSETS[@]}" -R "$target" --clobber
              GH_TOKEN="$token" gh release edit "${{ inputs.tag }}" -R "$target" \
                --title "$DIST" --notes-file release-notes.md
            else
              GH_TOKEN="$token" gh release create "${{ inputs.tag }}" "${ASSETS[@]}" -R "$target" \
                --title "$DIST" --notes-file release-notes.md
            fi
            echo "synced release ${{ inputs.tag }} -> $target"
          }
          sync_release "${{ env.PRIVATE_REPO }}" "$FERRITE_PAT"
          sync_release "hathawayANdRX105/ferrite-ci" "$SHELL_TOKEN"

      - name: dry run 收尾提示
        if: inputs.tag == '' || inputs.dry_run == 'true'
        run: echo "未发布 Release（tag 为空或 dry_run=true），构建产物随 runner 销毁；发版请推 ferrite-v* tag"

      - name: 回填 sccache 缓存（release 角色，日键）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
