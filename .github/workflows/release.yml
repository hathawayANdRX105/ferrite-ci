# ferrite 发布壳工作流：私有仓 hathawayANdRX105/ferrite 推 ferrite-v* tag（或手动派发）
# 由主仓 ferrite-release.yml 派发触发（on 只有 workflow_dispatch，同 ci.yml 不变量）。
# PAT 检出私有源码构建，产物直接发成私有主仓的 GitHub Release；
# 公开壳仓不落 artifact —— 私有代码的编译产物不进公开仓。
#   tag 非空 且 dry_run=false → 创建 Release（asset + notes 都写主仓）
#   tag 为空 或 dry_run=true  → 只编译打包验证，产物随 runner 销毁
#
# 三形态三 asset（方案 A：一条版本线，一个 tag 挂三份产物；形态别名定义在私有仓
# apps/api/Cargo.toml，本 workflow 只消费）：
#   ferrite-local   --no-default-features --features ferrite-local   （个人 relay，无 billing/mcp）
#   ferrite-tavern  --no-default-features --features ferrite-tavern  （用户酒馆，仅 tavern）
#   ferrite-server  --no-default-features --features ferrite-server  （服务器，tavern+billing+mcp）
# 三形态共用同一 tag、同一份 release notes，notes 不按形态分裂。
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的私有仓 commit / 分支'
        required: true
      tag:
        description: '要发布的 tag（ferrite-v*，空 = 不发布）'
        required: false
        default: ''
      dry_run:
        description: 'true = 只编译打包，不创建 Release'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: hathawayANdRX105/ferrite

jobs:
  release:
    runs-on: ubuntu-latest
    # LTO fat + codegen-units=1 冷启构建需要余量；三形态是三次独立 release 构建
    # （feature 图不同、无法复用产物），其中 local/tavern 两条 sccache 轨冷启，留 90。
    timeout-minutes: 90
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 装 mold
        # apt 曾整段挂死；显式重试 + 硬超时，让故障快速失败可重跑（同 ci.yml）。
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      - name: 装 sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 ci run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（release 角色，restore-only 回退到 test/lint 日键）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-release-${{ runner.os }}-v0.10.0-
            sccache-test-${{ runner.os }}-v0.10.0-
            sccache-lint-${{ runner.os }}-v0.10.0-

      - name: 编译三形态二进制
        run: |
          set -euo pipefail
          # 三形态 feature 图不同 → 各自独立 cargo build，且 --target-dir 必须隔离
          # （共用 target 会让三次 build 覆盖同一个 target/release/ferrite）。
          # --no-default-features 每条都不能省：省掉它 default（= ferrite-server）
          # 仍生效，三条会全变成 server 形态。
          build_one() {
            local name="$1"; shift
            echo ">>> cargo build ferrite-${name}: $*"
            cargo build --release -p api --target-dir "target/rel-${name}" "$@"
            cp "target/rel-${name}/release/ferrite" "out-bin/ferrite-${name}"
          }
          mkdir -p out-bin
          build_one local   --no-default-features --features ferrite-local
          build_one tavern  --no-default-features --features ferrite-tavern
          build_one server  --no-default-features --features ferrite-server
          ls -l out-bin

      - name: 打包
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ -n "$TAG" ]]; then
            # tag: ferrite-v<M.R.P>-g<hash>；三形态统一版本线（见 version-stats skill）
            SPEC="${TAG#ferrite-v}"               # M.R.P-g<hash>
            VER="${SPEC%%-g*}"                    # M.R.P
            DIST="ferrite-v${VER}-g${SPEC#*-g}"   # = TAG
          else
            VER="dev-$(git rev-parse --short HEAD)"
            DIST="ferrite-${VER}"
          fi
          # Release notes：只收用户可感知 commit，五组过滤（参照 oh-my-pi；口径 = version-stats skill）。
          # 在发版 commit 的父上找上一个 ferrite-v* tag，避免 describe 命中发版点自身导致区间为空
          if git rev-parse --quiet --verify 'HEAD^' >/dev/null; then
            LAST=$(git describe --match 'ferrite-v*' --tags --abbrev=0 'HEAD^' 2>/dev/null) || LAST=""
          else
            LAST=""
          fi
          if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; fi
          SUBJ=$(git log $RANGE --no-merges --format='%s')
          {
            echo "${DIST}"
            echo
            section() {
              local lines
              lines=$(grep -E "$2" <<< "$SUBJ" || true)
              if [ -n "$lines" ]; then
                echo "### $1"
                echo
                sed 's/^/- /' <<< "$lines"
                echo
              fi
            }
            section "Breaking Changes" '^[a-z]+(\([^)]*\))?!:'
            section "Added"            '^feat(\([^)]*\))?:'
            section "Changed"          '^refactor(\([^)]*\))?:'
            section "Fixed"            '^(fix|perf)(\([^)]*\))?:'
            section "Removed"          '^revert(\([^)]*\))?:'
          } > release-notes.md
          # 三份 tarball：目录名 = 形态前缀 + 版本段，tar 内是该形态二进制 +
          # 安全配置示例（占位符/注释字段；compose 专用的 deploy/config/config.toml
          # 含 compose 服务名/口令，不打包）。
          mkdir -p dist
          for form in local tavern server; do
            ADIST="ferrite-${form}-${DIST#ferrite-}"
            mkdir -p "dist/${ADIST}"
            cp "out-bin/ferrite-${form}" "dist/${ADIST}/"
            cp deploy/config/config.toml.example "dist/${ADIST}/config.toml.example"
            tar -czf "dist/${ADIST}-linux-x86_64.tar.gz" -C dist "${ADIST}"
            rm -rf "dist/${ADIST}"
          done
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "dist=${DIST}" >> "$GITHUB_OUTPUT"
          # 只输出哈希与体积（不 echo 源码/二进制内容）
          sha256sum dist/*.tar.gz
          du -h dist/*.tar.gz
        id: pkg

      - name: 发布 GitHub Release 到私有主仓
        if: inputs.tag != '' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.FERRITE_PAT }}
        run: |
          set -euo pipefail
          # 资产名 = ferrite-<形态>-<版本段>-linux-x86_64.tar.gz（版本段 = tag 去 ferrite- 前缀）
          DIST="${{ steps.pkg.outputs.dist }}"
          SPEC="${DIST#ferrite-}"
          gh release create "${{ inputs.tag }}" \
            "dist/ferrite-local-${SPEC}-linux-x86_64.tar.gz" \
            "dist/ferrite-tavern-${SPEC}-linux-x86_64.tar.gz" \
            "dist/ferrite-server-${SPEC}-linux-x86_64.tar.gz" \
            -R "${{ env.PRIVATE_REPO }}" \
            --title "${{ steps.pkg.outputs.dist }}" \
            --notes-file release-notes.md

      - name: dry run 收尾提示
        if: inputs.tag == '' || inputs.dry_run == 'true'
        run: echo "未发布 Release（tag 为空或 dry_run=true），构建产物随 runner 销毁；发版请推 ferrite-v* tag"

      - name: 回填 sccache 缓存（release 角色，日键）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
