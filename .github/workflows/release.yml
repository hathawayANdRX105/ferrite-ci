# ferrite 发布壳工作流：私有主仓（地址只在下方 PRIVATE_REPO env 出现）推 ferrite-v* tag（或手动派发），
# 由主仓 ferrite-release.yml 派发触发（on 只有 workflow_dispatch，同 ci.yml 不变量）。
# 检出凭据拉私有源码构建，产物两边同步发布（维护者 2026-10-09 决策：二进制 + APK +
# 五组 notes 可公开）：私有主仓 + 本公开壳仓，同一 tag 同一份资产与 notes。
# 源码仍不进壳仓：只在一次性 runner 检出，提交进本仓的只有 workflow YAML，Actions artifact 恒为 0。
#   tag 非空 且 dry_run=false → 两侧 Release 同步（缺失则创建，已存在则 clobber 资产并对齐 notes）
#   tag 为空 或 dry_run=true  → 只编译打包验证，产物随 runner 销毁
#
# 发布配方（单一来源）：优先读被发版 ref 的 deploy/compose.yml 末尾 x-release 块——
# Dockerfile 路径、形态、cargo 开关、tarball 包名与镜像坐标都来自主仓 deploy/ 树
# （目录与 apps/server/{api,web} 一一对位，见主仓 deploy/README.md）；本仓不再
# 自持第一份路径。老 ref 无该块时回退本仓世代探测（行为不变）：
#   三形态世代（ferrite-{local,tavern,server} 别名存在时）：三条各自
#     --no-default-features --features <别名>，三份 tarball 与三个 api 镜像 tag
#     （local/tavern 用形态名，server 用 :latest）。
#   单形态世代（别名收敛后）：只出 server，default 特性构建（= 完整产品）。
# 各形态共用同一 tag、同一 release notes，notes 不按形态分裂。
# 移动壳（apps|platforms/mobile，shell_root 探测双布局）恒随同一 tag 出一份 Android debug APK：
#   ferrite-mobile-<版本段>.apk（universal、未 strip，体积大属预期）。
#   用 debug 签名（免 keystore）——正式签名与产物分发口径由维护者另行裁决；
#   命令序列取自 W6 spike 的实测配方（todo/w6-spike/README.md §C/§F 同口径），
#   与形态二进制同一 job：不做 artifact 传递（保持「Actions artifact 恒为 0」），
#   构建失败即整条发布失败（原子性：要么全发要么不发）。
#
# 版本快照（2026-10-17 壳仓实测，spike run 39013969883 / 39014614301；三处浮点已锁）：
#   apps|platforms/desktop|mobile/package.json  @tauri-apps/cli = 2.12.3（exact，原 ^2.11.5）
#   apps|platforms/*/src-tauri/Cargo.toml      tauri = 2.12.4 / tauri-build = 2.7.3（两条版本线，
#                                   均为 exact；原均为 "2" caret）——取值来自壳仓绿 run
#                                   39013969883 的实编译日志（tauri v2.12.4 + tauri-build v2.7.3）；
#                                   写同一个号会在依赖解析期直接失败（ferrite #345 撞过）
#   tauri-cli 2.12.3 生成的 Android 模板栈（随 CLI 换代，升级须同步此快照）：
#     Gradle 9.6.1 / AGP 9.3.1 / Kotlin 2.2.10 / compileSdk 37 /
#     runner 预装 NDK 29.0.14206865（本 job 显式选版本） / JDK 17（AGP 9.x 最低）
#   注意：第一阶段 §2 记的 2.11.5 时代模板数据（Gradle 8.14.3 / AGP 8.11.0 /
#   Kotlin 1.9.25 / SDK 36）已过时——那份快照来自旧 CLI 模板常量，勿照抄。
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的私有仓 commit / 分支'
        required: true
      tag:
        description: '要发布的 tag（ferrite-v*，空 = 不发布）'
        required: false
        default: ''
      dry_run:
        description: 'true = 只编译打包，不创建 Release'
        required: false
        default: 'false'
      mobile:
        description: 'true = 附带构建 Android debug APK；false = 只发形态二进制'
        required: false
        default: 'true'

# contents: write 仅为发布到本壳仓自身（github.token 只覆盖本仓）；主仓仍走 FERRITE_PAT。
# token 不自动注入 env，仅下方发布步骤显式引用，构建步骤拿不到。
permissions:
  contents: write
  packages: write   # GHCR 推送（ferrite-api / ferrite-admin-web 镜像）

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: hathawayANdRX105/ferrite
  # GHCR 命名空间：镜像挂在维护者账号下，别人才能 ghcr.io/hathawayANdRX105/... 拉取。
  # 只用作 docker login 的用户名；推送坐标（registry/tag）由「读取发布配方」步骤给出。
  PRIVATE_REPO_OWNER: hathawayANdRX105

jobs:
  release:
    runs-on: ubuntu-latest
    # LTO fat + codegen-units=1 冷启构建需要余量；三形态世代是三次独立 release
    # 构建（feature 图不同、无法复用产物），其中 local/tavern 两条 sccache 轨冷启，
    # 留 90；单形态世代只需一次构建，余量富余。
    timeout-minutes: 90
    steps:
      - name: 检出私有源码（PAT）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.FERRITE_PAT }}
          fetch-depth: 0

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 装 mold
        # apt 曾整段挂死；显式重试 + 硬超时，让故障快速失败可重跑（同 ci.yml）。
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15
          timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=15 mold clang

      - name: 装 sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache 依赖（restore-only，写回归写入方 ci run）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 计算缓存日键
        id: cachekey
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache 产物（release 角色，restore-only 回退到 test/lint 日键）
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
          restore-keys: |
            sccache-release-${{ runner.os }}-v0.10.0-
            sccache-test-${{ runner.os }}-v0.10.0-
            sccache-lint-${{ runner.os }}-v0.10.0-

      - name: 读取发布配方（优先主仓 deploy/compose.yml 的 x-release）
        id: recipe
        run: |
          set -euo pipefail
          # 发布构建配方的单一来源 = 被发版 ref 的 deploy/compose.yml 末尾 x-release 块
          # （见主仓 deploy/README.md）。compose config 只做解析插值、不起容器；文件里的
          # 必填变量插值用哑值满足。老 ref 无该块 → 回退本仓世代探测：问 cargo metadata
          # 的 features 真身（同 ci.yml 的世代自适应风格），配方字段取旧世代等价值。
          RECIPE=""
          if [ -f deploy/compose.yml ]; then
            RECIPE=$(FERRITE_JWT_SECRET=recip-parse docker compose -f deploy/compose.yml config --format json 2>/dev/null \
              | jq -c '."x-release" // empty') || RECIPE=""
          fi
          if [ -n "$RECIPE" ]; then
            echo '>>> 发布配方：deploy/compose.yml x-release'
            # 块存在但字段缺失是发布配置错误，宁可炸也不静默回退（配方漂移必须响）。
            jq -e 'has("form") and has("bin_pkg") and has("api_features")
                   and has("dockerfile_api") and has("dockerfile_web")
                   and has("image_registry") and has("image_tag")' <<<"$RECIPE" >/dev/null
            printf '%s|%s\n' "$(jq -r '.form' <<<"$RECIPE")" "$(jq -r '.api_features' <<<"$RECIPE")" > shapes.txt
            {
              echo "source=compose"
              echo "bin_pkg=$(jq -r '.bin_pkg' <<<"$RECIPE")"
              echo "dockerfile_api=$(jq -r '.dockerfile_api' <<<"$RECIPE")"
              echo "dockerfile_web=$(jq -r '.dockerfile_web' <<<"$RECIPE")"
              echo "image_registry=$(jq -r '.image_registry' <<<"$RECIPE")"
              echo "image_tag=$(jq -r '.image_tag' <<<"$RECIPE")"
            } >> "$GITHUB_OUTPUT"
          else
            echo '>>> 发布配方：老 ref 回退（本仓世代探测）'
            # 形态清单落在 shapes.txt：每行 <形态名>|<cargo feature 参数>（可为空）。
            # 三形态世代每条都不能省 --no-default-features——省掉 default 仍生效，
            # 三条会全变成同一形态；单形态世代只出 server 一条，default 即完整产品。
            if cargo metadata --format-version 1 --no-deps \
              | jq -e '.packages[] | select(.name == "api") | .features | has("ferrite-local")' > /dev/null; then
              printf '%s\n' \
                'local|--no-default-features --features ferrite-local' \
                'tavern|--no-default-features --features ferrite-tavern' \
                'server|--no-default-features --features ferrite-server' > shapes.txt
            else
              printf '%s\n' 'server|' > shapes.txt
            fi
            {
              echo "source=legacy"
              echo "bin_pkg=api"
              echo "dockerfile_api=deploy/api/Dockerfile"
              echo "dockerfile_web=deploy/web/Dockerfile"
              echo "image_registry=ghcr.io/${PRIVATE_REPO_OWNER}"
              echo "image_tag=latest"
            } >> "$GITHUB_OUTPUT"
          fi
          echo '>>> 形态清单（<形态名>|<feature 参数>）：'
          cat shapes.txt

      - name: 编译形态二进制
        env:
          BIN_PKG: ${{ steps.recipe.outputs.bin_pkg }}
        run: |
          set -euo pipefail
          # 各形态 feature 图不同 → 各自独立 cargo build，且 --target-dir 必须隔离
          # （共用 target 会让多次 build 覆盖同一个 target/release/ferrite）。
          build_one() {
            local name="$1"; shift
            echo ">>> cargo build ferrite-${name}: $*"
            cargo build --release -p "$BIN_PKG" --target-dir "target/rel-${name}" "$@"
            cp "target/rel-${name}/release/ferrite" "out-bin/ferrite-${name}"
          }
          mkdir -p out-bin
          # $features 故意不加引号：可能含多个参数（--no-default-features --features X）；
          # 单形态世代为空串时展开为零个参数（走 default 构建）。
          while IFS='|' read -r name features; do
            [ -n "$name" ] || continue
            build_one "$name" $features
          done < shapes.txt
          ls -l out-bin

      - name: 打包（tarball 命名随配方世代）
        env:
          SOURCE: ${{ steps.recipe.outputs.source }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ -n "$TAG" ]]; then
            # tag: ferrite-v<M.R.P>-g<hash>；各形态统一版本线（见 version-stats skill）
            SPEC="${TAG#ferrite-v}"               # M.R.P-g<hash>
            VER="${SPEC%%-g*}"                    # M.R.P
            DIST="ferrite-v${VER}-g${SPEC#*-g}"   # = TAG
          else
            VER="dev-$(git rev-parse --short HEAD)"
            DIST="ferrite-${VER}"
          fi
          # Release notes：只收用户可感知 commit，五组过滤（参照 oh-my-pi；口径 = version-stats skill）。
          # 在发版 commit 的父上找上一个 ferrite-v* tag，避免 describe 命中发版点自身导致区间为空
          if git rev-parse --quiet --verify 'HEAD^' >/dev/null; then
            LAST=$(git describe --match 'ferrite-v*' --tags --abbrev=0 'HEAD^' 2>/dev/null) || LAST=""
          else
            LAST=""
          fi
          if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; fi
          SUBJ=$(git log $RANGE --no-merges --format='%s')
          {
            echo "${DIST}"
            echo
            section() {
              local lines
              lines=$(grep -E "$2" <<< "$SUBJ" || true)
              if [ -n "$lines" ]; then
                echo "### $1"
                echo
                sed 's/^/- /' <<< "$lines"
                echo
              fi
            }
            section "Breaking Changes" '^[a-z]+(\([^)]*\))?!:'
            section "Added"            '^feat(\([^)]*\))?:'
            section "Changed"          '^refactor(\([^)]*\))?:'
            section "Fixed"            '^(fix|perf)(\([^)]*\))?:'
            section "Removed"          '^revert(\([^)]*\))?:'
          } > release-notes.md
          # tarball：配方世代（单构建）→ 资产名 = tag + -linux-x86_64.tar.gz（主仓
          # deploy/README.md 口径），内层目录名 = DIST；老世代回退（逐形态）→ 每形态
          # 一份，目录名 = 形态前缀 + 版本段。
          # 语料必须是运行时资产：渠道探活（channel_test）从
          # config/prompt-templates.jsonl 读提问语料，二进制不内嵌它
          # （见 control_plane::prompt_templates::load_templates）。
          # 漏打它 → 裸机部署解压即用、但探活报「no prompt template available」。
          mkdir -p dist
          while IFS='|' read -r form _; do
            [ -n "$form" ] || continue
            if [ "$SOURCE" = compose ]; then
              ADIST="$DIST"
            else
              ADIST="ferrite-${form}-${DIST#ferrite-}"
            fi
            mkdir -p "dist/${ADIST}/config"
            cp "out-bin/ferrite-${form}" "dist/${ADIST}/"
            cp config/prompt-templates.jsonl "dist/${ADIST}/config/"
            tar -czf "dist/${ADIST}-linux-x86_64.tar.gz" -C dist "${ADIST}"
            rm -rf "dist/${ADIST}"
          done < shapes.txt
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "dist=${DIST}" >> "$GITHUB_OUTPUT"
          # 只输出哈希与体积（不 echo 源码/二进制内容）
          sha256sum dist/*.tar.gz
          du -h dist/*.tar.gz
        id: pkg

      # ---- Android debug APK（apps|platforms/mobile；命令序列 = W6 spike 实测配方）----
      - name: 装 Java 17（Android 构建链）
        if: inputs.mobile == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Bun（移动壳的 tauri-cli 入口）
        if: inputs.mobile == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Product web bundle prerequisites
        if: inputs.mobile == 'true'
        run: |
          set -euo pipefail
          if [ -d apps/coder-mobile/web ]; then
            rustup target add wasm32-unknown-unknown
            cargo install dioxus-cli --locked --version 0.7.10
          fi

      - name: Android 工具链（SDK / NDK 三变量 / aarch64 target）
        if: inputs.mobile == 'true'
        run: |
          set -euo pipefail
          # runner 预装 Android SDK；NDK 取版本号最大的一个（spike 实测路径形态）。
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "Android SDK 不在 $SDK"; exit 1; }
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          test -n "$NDK" || { echo "NDK 缺失（$SDK/ndk/*）"; exit 1; }
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          # 证据：选定 NDK 的版本串（spike 报告 §F 同口径）
          grep -E '^Pkg\.Revision' "$NDK/source.properties"

      - name: 构建 Android debug APK
        if: inputs.mobile == 'true'
        run: |
          set -euo pipefail
          shell_root=$([ -d platforms ] && echo platforms || echo apps)
          if [ "$shell_root" = "apps" ]; then
            mobile_dir="apps/coder-mobile"
          else
            mobile_dir="platforms/mobile"
          fi
          cd "$mobile_dir"
          SPEC="${{ steps.pkg.outputs.dist }}"
          SPEC="${SPEC#ferrite-}"
          bun install
          bunx tauri android init --ci
          bunx tauri android build --debug --apk --target aarch64
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$APK" || { echo "APK 未产出：$APK"; exit 1; }
          cp "$APK" "../../dist/ferrite-mobile-${SPEC}.apk"
          # 证据行：路径 + 体积 + sha256（不 echo 产物内容）
          sha256sum "../../dist/ferrite-mobile-${SPEC}.apk"
          du -h "../../dist/ferrite-mobile-${SPEC}.apk"

      # ---- 容器镜像（GHCR）----
      # Dockerfile 与镜像坐标来自「读取发布配方」步骤（单一来源 = 主仓 deploy/ 树；
      # 老 ref 回退旧 deploy/{api,web} 路径）。把它们接在发布链上，让「别人 docker
      # compose up 就能用」成立——deploy/compose.yml 的 image 字段与配方
      # image_registry / image_tag 同源，主仓 deploy/README.md 有约束说明。
      #
      # tag 口径与 compose 期望一致：server → IMAGE_TAG（当前 :latest），其余形态用
      # 形态名；每个镜像另打一个版本 tag，便于回溯某个 release 用了哪些镜像。
      #
      # 登录用 FERRITE_PAT（与主仓 Release 同步同一个 PAT）：镜像要挂在维护者账号下
      # 才能让别人拉；用 github.token 会挂在壳仓名下，而壳仓是公开壳、不是产物归属。
      # 依赖 FERRITE_PAT 具 write:packages 权限——该范围无法在此仓内自证，
      # 首次推送后需确认 ghcr.io/hathawayANdRX105/ferrite-api 的 tags 列表。
      - name: 登录 GHCR
        if: inputs.tag != '' && inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.PRIVATE_REPO_OWNER }}
          password: ${{ secrets.FERRITE_PAT }}

      - name: 构建并推送容器镜像
        if: inputs.tag != '' && inputs.dry_run != 'true'
        env:
          TAG: ${{ inputs.tag }}
          DOCKERFILE_API: ${{ steps.recipe.outputs.dockerfile_api }}
          DOCKERFILE_WEB: ${{ steps.recipe.outputs.dockerfile_web }}
          REGISTRY: ${{ steps.recipe.outputs.image_registry }}
          IMAGE_TAG: ${{ steps.recipe.outputs.image_tag }}
        run: |
          set -euo pipefail
          SPEC="${TAG#ferrite-v}"
          # compose 的 tag 契约：server → 配方的 IMAGE_TAG，其余形态用形态名；
          # 单形态清单只有 server → 只推 IMAGE_TAG，deploy/compose.yml 的 image 契约不变。
          tag_for() { case "$1" in server) echo "$IMAGE_TAG" ;; *) echo "$1" ;; esac; }
          # FEATURES 传形态的 cargo 参数（可为空 = default 构建，见配方 dockerfile_api 头部说明）。
          while IFS='|' read -r form features; do
            [ -n "$form" ] || continue
            docker build -f "$DOCKERFILE_API" \
              --build-arg "FEATURES=${features}" \
              -t "${REGISTRY}/ferrite-api:$(tag_for "$form")" \
              -t "${REGISTRY}/ferrite-api:$(tag_for "$form")-${SPEC}" \
              .
            docker push "${REGISTRY}/ferrite-api:$(tag_for "$form")"
            docker push "${REGISTRY}/ferrite-api:$(tag_for "$form")-${SPEC}"
          done < shapes.txt
          # admin-web 各形态共用同一个 SPA（web 配方无形态参数），按形态裁剪跟踪在
          # 主仓 issue #59。
          docker build -f "$DOCKERFILE_WEB" \
            -t "${REGISTRY}/ferrite-admin-web:${IMAGE_TAG}" \
            -t "${REGISTRY}/ferrite-admin-web:${SPEC}" .
          docker push "${REGISTRY}/ferrite-admin-web:${IMAGE_TAG}"
          docker push "${REGISTRY}/ferrite-admin-web:${SPEC}"

      - name: 两边同步发布 GitHub Release（私有主仓 + 公开壳仓）
        if: inputs.tag != '' && inputs.dry_run != 'true'
        env:
          FERRITE_PAT: ${{ secrets.FERRITE_PAT }}
          SHELL_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.recipe.outputs.source }}
        run: |
          set -euo pipefail
          # 资产名：配方世代 = tag + -linux-x86_64.tar.gz（与打包步骤同源）；
          # 老世代 = ferrite-<形态>-<版本段>-linux-x86_64.tar.gz（版本段 = tag 去 ferrite- 前缀）。
          DIST="${{ steps.pkg.outputs.dist }}"
          SPEC="${DIST#ferrite-}"
          ASSETS=()
          if [ "$SOURCE" = compose ]; then
            ASSETS+=("dist/${DIST}-linux-x86_64.tar.gz")
          else
            while IFS='|' read -r form _; do
              [ -n "$form" ] || continue
              ASSETS+=("dist/ferrite-${form}-${SPEC}-linux-x86_64.tar.gz")
            done < shapes.txt
          fi
          if [[ "${{ inputs.mobile }}" == "true" ]]; then
            test -f "dist/ferrite-mobile-${SPEC}.apk" || { echo "缺少移动资产 dist/ferrite-mobile-${SPEC}.apk"; exit 1; }
            ASSETS+=("dist/ferrite-mobile-${SPEC}.apk")
          fi
          # 同一口径同步两侧：缺失则创建（资产 + 标题 + notes），已存在则 clobber 资产并对齐 notes。
          # 主仓用 FERRITE_PAT（跨仓），壳仓用本 workflow 的 github.token（仅本仓写权）。
          sync_release() {
            local target="$1" token="$2"
            if GH_TOKEN="$token" gh release view "${{ inputs.tag }}" -R "$target" >/dev/null 2>&1; then
              GH_TOKEN="$token" gh release upload "${{ inputs.tag }}" "${ASSETS[@]}" -R "$target" --clobber
              GH_TOKEN="$token" gh release edit "${{ inputs.tag }}" -R "$target" \
                --title "$DIST" --notes-file release-notes.md
            else
              GH_TOKEN="$token" gh release create "${{ inputs.tag }}" "${ASSETS[@]}" -R "$target" \
                --title "$DIST" --notes-file release-notes.md
            fi
            echo "synced release ${{ inputs.tag }} -> $target"
          }
          sync_release "${{ env.PRIVATE_REPO }}" "$FERRITE_PAT"
          sync_release "hathawayANdRX105/ferrite-ci" "$SHELL_TOKEN"

      - name: dry run 收尾提示
        if: inputs.tag == '' || inputs.dry_run == 'true'
        run: echo "未发布 Release（tag 为空或 dry_run=true），构建产物随 runner 销毁；发版请推 ferrite-v* tag"

      - name: 回填 sccache 缓存（release 角色，日键）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-release-${{ runner.os }}-v0.10.0-${{ steps.cachekey.outputs.d }}
