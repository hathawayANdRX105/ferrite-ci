# 缓存管理（手动）：强制冷启动或清垃圾用，不做定时全量清空
# （定时清空 = 保证下一个 run 冷编译 20+ 分钟，是反向优化）。
# 常规淘汰靠 GitHub 7 天未访问 LRU；升工具链时 bump workflow 里的键前缀即可。
name: cache-admin

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: '要删除的缓存 key 前缀（如 sccache-lint-）；留空 = 全部'
        required: false
        default: ''

permissions:
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 删除匹配缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | "\(.id) \(.key)"' |
          while read -r id key; do
            if [ -z "$PREFIX" ] || [[ "$key" == "$PREFIX"* ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" && echo "deleted $id $key"
            fi
          done
