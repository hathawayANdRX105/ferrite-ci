# dispatch-poller：cron 轮询私有仓的 PR / main，发现未测的头提交就派发壳仓 ci。
#
# 目的：把 ci-dispatch 的触发从「私有仓事件」改成「公开壳仓轮询」，私有仓零 workflow、
# 零分钟数（公开壳仓 runner 全免费）。私有仓 ci-dispatch.yml 已删除。
#
# 去重键 = 私有仓头提交上的 commit status（私有仓零 workflow，status 由壳仓 report 写回）：
#   - PR：   context=shell-ci      —— 快关门禁，成功/失败都算「测过」
#   - main： context=shell-ci-full —— 合并后兜底，成功/失败都算「测过」
# 只要头提交已有对应 context 的 status 就跳过，否则派发。
#
# 约束：
#   - GitHub 最短 schedule 间隔 5 分钟（`*/5 * * * *`），故反馈延迟 ≤ 5 分钟。
#   - 公开仓无仓库活动 60 天后 schedule 自动禁用（ferrite-ci 活跃，不触发）。
#   - concurrency 只串行不 cancel：轮询间隔 5min < 一次轮询可能耗时，重叠时排队；
#     重复派发无害（ci.yml 按 pr-N concurrency cancel-in-progress + status 去重）。
#
# 与旧 ci-dispatch 语义对齐：
#   - PR（非草稿）→ fast-close（testless），full=false，status 落 PR 头提交
#   - main 最新提交 → 全量，full=true（condition 由 ci.yml 自己算 HEAD^）
#
# 用 FERRITE_PAT（壳仓已有，读私有仓 PR + 写 status 都够）。
name: dispatch-poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-poller
  # 不 cancel-in-progress：重叠的 poll 排队，避免中途被 cancel 导致重复派发窗口变宽。
  # 队列最长 = poll 耗时（<5min），cron 天然限速。

env:
  PRIVATE_REPO: hathawayANdRX105/ferrite

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 轮询私有仓 PR + main，派发未测的
        env:
          GH_TOKEN: ${{ secrets.FERRITE_PAT }}
        run: |
          set -euo pipefail

          # 有对应 status 就 skip（返回 0）；没有则 dispatch（返回 1）。sha 不存在（分支删/force-push）按「没有 status」处理，等下一次成功解析。
          status_exists() {
            local ctx="$1" sha="$2"
            local n
            n="$(gh api "repos/${{ env.PRIVATE_REPO }}/commits/$sha/statuses" \
              --jq "[.[] | select(.context==\"$ctx\")] | length" 2>/dev/null || echo 0)"
            [ "$n" -ge 1 ]
          }

          dispatch() { # 独立派发，失败不回传（不 abort 整个 poll；一条 422 不耽误其余 PR）
            if ! gh workflow run ci.yml -R "${{ github.repository }}" "$@" 2>/tmp/dispatch.err; then
              echo "::warning title=派发失败::$(tr '\n' ' ' < /tmp/dispatch.err | head -c 200)"
              return 0
            fi
            echo ">>> 已派发: $*"
          }

          echo "===== 1) PR 快关门禁（shell-ci） ====="
          # 开放且非草稿的 PR；头提交无 shell-ci 就派发 fast-close。
          # 用 --paginate 覆盖 per_page=100 上限；readarray 逐行避免子 shell 里 shopt 丢失。
          readarray -t prs < <(gh api --paginate "repos/${{ env.PRIVATE_REPO }}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false) | [.number, .head.sha, .base.ref, .title] | @tsv' 2>/dev/null)
          for row in "${prs[@]:-}"; do
            [ -z "$row" ] && continue
            num="$(cut -f1 <<<"$row")"
            sha="$(cut -f2 <<<"$row")"
            base="$(cut -f3 <<<"$row")"
            title="$(cut -f4 <<<"$row")"
            if status_exists shell-ci "$sha"; then
              echo ">>> PR #$num 头 $sha 已有 shell-ci，跳过（$title）"
              continue
            fi
            dispatch -f sha="$sha" -f status_sha="$sha" -f pr="$num" -f base="$base" -f full=false
          done

          echo "===== 2) main 合并后兜底（shell-ci-full） ====="
          main_sha="$(gh api "repos/${{ env.PRIVATE_REPO }}/commits/main" --jq '.sha' 2>/dev/null || echo '')"
          if [ -z "$main_sha" ]; then
            echo ">>> 取 main 最新提交失败，跳过（下次 poll 重试）"
          elif status_exists shell-ci-full "$main_sha"; then
            echo ">>> main $main_sha 已有 shell-ci-full，跳过"
          else
            dispatch -f sha="$main_sha" -f status_sha="$main_sha" -f pr='' -f base='main' -f full=true
          fi